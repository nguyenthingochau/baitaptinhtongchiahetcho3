<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tinh tong</title>
</head>
<body>
    <h2>Tinh tong cac so chia het cho 3</h2>

    <form onsubmit="handleSubmit(event)">
        So dau:
        <input type="number" id="soDau" required>
        <br><br>

        So cuoi:
        <input type="number" id="soCuoi" required>
        <br><br>

        <button type="submit">Tinh tong</button>
    </form>

    <p id="ketQua"></p>

    <script>
        function handleSubmit(event)
        {
            event.preventDefault();

            const soDau = Number(document.getElementById("soDau").value);
            const soCuoi = Number(document.getElementById("soCuoi").value);

            let tong = 0;

            for (let i = soDau; i <= soCuoi; i++)
            {
                if (i % 3 == 0)
                {
                    tong = tong + i;
                }
            }

            document.getElementById("ketQua").innerHTML =
                "Tong cac so chia het cho 3 la: " + tong;
        }
    </script>
</body>
</html>
